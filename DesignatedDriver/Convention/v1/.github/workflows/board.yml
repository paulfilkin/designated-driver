# Adds new issues and pull requests to the project board. GitHub's own project automations do the rest: a new
# item lands in Todo, and a closed issue or merged pull request moves to Done.
# It needs the PROJECT_TOKEN secret, a classic token with the repo and project scopes, because the
# workflow's own GITHUB_TOKEN cannot reach a user-owned project. A run started by Dependabot reads Dependabot's
# secrets, not the repository's, so the token is stored for both. Without it the run warns that nothing was
# added and still passes; the board's own Auto-add workflow does the same job with no token at all.
name: Board

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened]

permissions: {}

jobs:
  board:
    name: Add to the board
    runs-on: ubuntu-latest
    env:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    steps:
      - name: Add to the board
        if: env.PROJECT_TOKEN != ''
        uses: actions/add-to-project@v2.0.1
        with:
          project-url: https://github.com/users/{{boardOwner}}/projects/{{boardNumber}}
          github-token: ${{ env.PROJECT_TOKEN }}
      - name: Say that nothing was added
        if: env.PROJECT_TOKEN == ''
        run: echo "::warning title=Not added to the board::PROJECT_TOKEN isn't set for this run, so nothing was added to the board. Turn on the board's Auto-add workflow, or store the token for Actions and for Dependabot."
