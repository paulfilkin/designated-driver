# Code scanning with CodeQL. GitHub offers it free on public repositories only, so Repo Starter writes this
# workflow on public repositories and records it as not available on private ones.
name: CodeQL

on:
  push:
    branches: [{{defaultBranch}}]
  pull_request:
    branches: [{{defaultBranch}}]
  schedule:
    - cron: '30 6 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyse:
    name: Analyse ({{codeqlLanguage}})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: {{codeqlLanguage}}
          build-mode: {{codeqlBuildMode}}

      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:{{codeqlLanguage}}"
